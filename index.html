<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Cursor Dash</title>
    <script>
      // Applied before paint to avoid a flash of the wrong theme. Order of
      // precedence: explicit user choice in localStorage, then OS preference,
      // defaulting to dark (this dashboard is designed dark-first).
      (function () {
        var stored = localStorage.getItem('cursor-dash-theme')
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.classList.toggle('dark', theme !== 'light')
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      #splash img {
        width: 132px;
        height: 132px;
        border-radius: 22px;
        opacity: 0;
        animation: splash-fade-in 1.2s ease-in forwards;
      }
      #splash.splash-out {
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }
      @keyframes splash-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: none;
          opacity: 1;
        }
      }
    </style>
    <script>
      // Plain HTML/CSS, independent of the React bundle, so the splash
      // paints immediately rather than waiting on JS to hydrate. The app
      // mounts underneath in the meantime; the overlay times itself out
      // 3s after this script runs (right after first paint), then fades away.
      setTimeout(function () {
        var el = document.getElementById('splash')
        if (!el) return
        el.classList.add('splash-out')
        setTimeout(function () {
          el.remove()
        }, 300)
      }, 3000)
    </script>
  </head>
  <body>
    <div id="splash"><img src="/logo.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
